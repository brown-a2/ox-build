apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-ms
  namespace: totoro-ms-build-{{ .Values.env }}
  labels:
    app: wordpress-ms
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wordpress-ms
  template:
    metadata:
      labels:
        app: wordpress-ms
    spec:
      containers:
        - name: wordpress
          image: browna2/ox-build-wordpress:latest
          ports:
            - containerPort: 9000
          envFrom:
            - secretRef:
                name: wordpress-secrets
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html

        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-config-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: wordpress-data
              mountPath: /var/www/html

      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: wordpress-data-pvc
        - name: nginx-config-volume
          configMap:
            name: nginx-config  # Reference the Nginx ConfigMap
